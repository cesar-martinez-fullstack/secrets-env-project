name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not report security vulnerabilities here** — see SECURITY.md.
        **Never paste real secrets, vault files or `.env` contents.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SecretVault version
      placeholder: v0.1.0 (or commit SHA)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options: [Docker, Compiled binary, From source (bun run dev), Other]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and browser
      placeholder: Windows 11, Firefox 130
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
